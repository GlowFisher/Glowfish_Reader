name: host-ci
on:
  pull_request:
  push:
    branches: [main, integration/2.0, maintenance/1.0]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm run check && npm test && npm run build
        working-directory: components/ui
      - run: python -m pip install -r glowfish_reader/proofread/requirements-app.txt
      - run: python -m pip install -e components/contracts -e components/ocr -e components/account -e . pytest
      - run: python scripts/validate_components.py
      - run: python scripts/check_architecture.py
      - run: python -m pytest tests -q --basetemp p
      - run: python -m pytest proofread -q --basetemp ../p
        working-directory: glowfish_reader
