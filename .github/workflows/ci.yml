name: ocr-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest pillow numpy
      - run: python -m pytest tests -q
      - run: python -m compileall -q src legacy
      - run: python scripts/check_architecture.py
