[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glowfish-ocr"
version = "1.2.0"
description = "Local OCR service for Glowfish Reader"
requires-python = ">=3.12"
license = {text = "AGPL-3.0"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glowfish_ocr = ["legacy/assets/lexicon/*.txt"]
