# 产品官网（主域）—— 放到 /etc/nginx/conf.d/glowfish-site.conf
#
# 与授权子域 (nginx-shupai-license.conf) 共存于同一台香港机：
#   · license.glowfishreader.com  → 授权后端 + /dl/ + /update.json（既有）
#   · glowfishreader.com / www    → 本文件：产品官网静态站
#
# 静态站根：/var/www/glowfish/site/（deploy_site.sh 上传落点）
# 下载与版本清单在主域同源镜像既有静态目录，使站内 fetch('/update.json') 与
# 下载直链都走主域（同源、无跨域），文件与授权子域共用同一份：
#   /var/www/glowfish/update.json   /var/www/glowfish/dl/
#
# 上线顺序：先以本文件（仅 80 端口）起站，DNS 主域+www A 记录解析到本机后，跑
#   certbot --nginx -d glowfishreader.com -d www.glowfishreader.com
# certbot 会自动补 443 + HTTP→HTTPS 跳转（就地改写本文件，与 license 子域一致）。

server {
    listen 80;
    listen [::]:80;
    server_name glowfishreader.com www.glowfishreader.com;

    root /var/www/glowfish/site;
    index index.html;

    # 应用自动更新：版本清单 + 安装包，与授权子域共用同一份静态文件（同源镜像）。
    # 精确/前缀匹配优先级高于 location /，故不会被 SPA 兜底吃掉。
    location = /update.json {
        alias /var/www/glowfish/update.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location ^~ /dl/ {
        alias /var/www/glowfish/dl/;
        autoindex off;
    }

    # 指纹化静态资源（字体/图片）可长缓存；HTML/JSON 保持短缓存便于改版即时生效。
    location ~* \.(woff2|png|webp|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
