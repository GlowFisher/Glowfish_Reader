openapi: 3.1.0
info:
  title: Glowfish Reader Local Host API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": {description: Healthy}
  /api/me:
    get:
      operationId: currentUser
      responses:
        "200": {description: Current user}
        "401": {description: Not logged in}
  /api/open:
    post:
      operationId: openDocument
      responses:
        "200": {description: Document opened}
  /api/import_progress:
    get:
      operationId: importProgress
      responses:
        "200": {description: OCR progress}
  /api/save:
    post:
      operationId: saveProof
      responses:
        "200": {description: Saved}
  /api/reocr_region:
    post:
      operationId: reocrRegion
      responses:
        "200": {description: Region result}
  /api/export:
    post:
      operationId: exportDocument
      responses:
        "200": {description: Exported document}
