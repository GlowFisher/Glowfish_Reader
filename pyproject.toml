[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glowfish-contracts"
version = "1.0.0"
description = "Versioned data and API contracts for Glowfish Reader"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
