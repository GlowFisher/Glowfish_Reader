<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Glowfish refined app icon</title>
  <desc id="desc">A cleaned Glowfish app icon redrawn from the original fish lines on a blue rounded background.</desc>
  <defs>
    <linearGradient id="appBg" x1="42" y1="0" x2="214" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f9df6"/>
      <stop offset="1" stop-color="#0453b5"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="70" y1="20" x2="132" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dbffe1"/>
      <stop offset=".28" stop-color="#44edeb"/>
      <stop offset=".68" stop-color="#23b8e8"/>
      <stop offset="1" stop-color="#1482da"/>
    </linearGradient>
    <linearGradient id="fishBelly" x1="126" y1="78" x2="126" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffea"/>
      <stop offset="1" stop-color="#f5ffdb"/>
    </linearGradient>
    <filter id="softDepth" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.3" flood-color="#00113e" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#appBg)"/>
  <path d="M-60 -84C30 -46 142 -8 232 4C166 54 73 86 -8 75C-35 59 -51 4 -60 -84Z" fill="#fff" opacity=".12"/>
  <path d="M112 112C183 110 255 150 330 318C225 309 141 249 112 112Z" fill="#001e64" opacity=".15"/>
  <rect x="4.5" y="4.5" width="247" height="247" rx="51.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>

  <g id="fish" filter="url(#softDepth)" stroke="#06153a" stroke-linecap="round" stroke-linejoin="round">
    <path id="upper-fin" d="M47 55C61 39 84 34 107 45C92 57 81 78 75 101C68 82 57 66 47 55Z" fill="url(#fishBody)" stroke-width="4.45"/>
    <path id="tail" d="M79 176C103 199 136 206 188 198C168 218 143 227 118 222C126 229 135 234 143 237C113 229 92 207 79 176Z" fill="url(#fishBody)" stroke-width="4.45"/>
    <path id="body" d="M80 67C104 37 136 22 169 25C195 27 216 39 229 58C235 67 231 78 219 89C207 99 190 106 175 114C146 129 125 151 111 176C103 191 102 205 107 214C83 204 67 180 62 150C58 119 66 88 80 67Z" fill="url(#fishBody)" stroke-width="4.45"/>
    <path id="belly" d="M223 77C190 79 156 92 127 112C103 129 88 153 82 176C84 193 94 207 107 214C112 201 123 184 138 166C158 143 181 127 209 115C223 109 231 96 231 84C230 80 227 78 223 77Z" fill="url(#fishBelly)" stroke-width="0"/>
    <path id="belly-line" d="M222 78C188 80 154 94 126 113C103 130 89 153 82 176" fill="none" stroke-width="3.65"/>
    <path id="fin-seam" d="M107 45C92 59 82 78 75 101" fill="none" stroke-width="3.55"/>
    <path id="tail-seam" d="M79 176C105 198 137 205 188 198" fill="none" stroke-width="3.55"/>
    <circle id="eye" cx="180" cy="43" r="3.8" fill="#06153a" stroke-width="0"/>
  </g>
