[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glowfish-reader-host"
version = "1.0.3"
description = "Glowfish Reader Windows desktop integration host"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn"]
license = {text = "AGPL-3.0"}
[project.optional-dependencies]
test = ["pytest", "psutil", "httpx2", "python-docx"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
